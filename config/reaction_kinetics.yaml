# Reaction Kinetics Configuration (Mignard & Pritchard 2008 / Graaf et al.)
# Catalyst: Commercial CuO/ZnO/Al2O3 (CZA)

reactions:
  methanol_synthesis:
    equation: "CO2 + 3 H2 <=> CH3OH + H2O"
    dH_298_kJ_mol: -49.5
    A: 1.07 # mol / (s * kg * bar^2)
    E_a_J_mol: -40000.0 # apparent activation energy in exp(+40000/(RT))

  rwgs:
    equation: "CO2 + H2 <=> CO + H2O"
    dH_298_kJ_mol: 41.2
    A: 1.22e10 # mol / (s * kg * bar)
    E_a_J_mol: 98084.0 # J / mol

adsorption_parameters:
  K_H2O:
    A: 6.62e-11 # 1/bar
    dH_J_mol: -124119.0 # J / mol
  K_H2_sqrt:
    A: 0.499 # 1/bar^0.5
    dH_J_mol: -17197.0 # J / mol
  K_H2O_H2: 3453.38 # dimensionless

equilibrium_constants:
  log10_Keq1:
    A: 3066.0
    B: -10.592
  log10_Keq2:
    A: -2073.0
    B: 2.029

catalyst_stability:
  min_p_h2o_fraction_total_P: 0.015 # Minimum 1.5% of P_total (1.50 bar at 100 bar)
  bulk_density_kg_m3: 1150.0
  pellet_diameter_m: 0.003
  bed_voidage: 0.40
