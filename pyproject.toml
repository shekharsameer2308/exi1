[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "membrane-reactor-sciml"
version = "2.0.0"
description = "Scientific computing and SciML framework for intensified catalytic membrane reactors for e-methanol production"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchdiffeq>=0.2.3",
    "scipy>=1.10.0",
    "numpy>=1.23.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "botorch>=0.9.0",
    "gpytorch>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ml*", "visualization*", "config*"]
